<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shared Folder</title>
<link rel="stylesheet" href="/assets/drive.css" />
</head>
<body>
<div id="login-view" class="center-page" hidden>
  <form class="login-card" id="login-form">
    <div id="login-logo"></div>
    <h1 id="login-title">Shared folder</h1>
    <p id="login-desc">Enter the password to open this folder.</p>
    <div class="field">
      <label for="password-input">Password</label>
      <input type="password" id="password-input" autocomplete="current-password" required />
    </div>
    <div class="error" id="login-error" hidden></div>
    <button type="submit" class="btn">Open folder</button>
  </form>
</div>

<div id="app-view" hidden>
  <header class="app-bar">
    <button class="icon-btn" id="menu-btn" title="Main menu" aria-label="Main menu"></button>
    <div class="brand"><span id="brand-logo"></span><span class="brand-name" id="brand-name">Shared folder</span></div>
    <label class="search" id="search-box">
      <span class="icon-btn" id="search-icon" aria-hidden="true"></span>
      <input type="search" id="search-input" placeholder="Search in this folder" autocomplete="off" />
    </label>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head"><span id="drawer-logo"></span><span>Shared folder</span></div>
      <button class="new-btn" id="new-btn" hidden></button>
      <button class="nav-item active" id="nav-root" data-close-drawer></button>
      <div class="sidebar-foot">
        <div id="access-note"></div>
        <div id="limit-note" hidden></div>
        <button class="nav-item" id="logout-btn" style="padding-left:0"></button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <button class="fab" id="fab" title="Upload" aria-label="Upload" hidden></button>
  <div class="scrim" id="scrim" hidden></div>
</div>

<script src="/assets/drive.js"></script>
<script>
const { h, icon, logo, toast } = Drive;
const shareId = location.pathname.split("/")[2];
const base = "/share/" + shareId;
const q = (rel) => "?path=" + encodeURIComponent(rel);
let browser = null;

async function api(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function permissionText(p) {
  return p === "both" ? "You can view, download and upload" : p === "read" ? "View and download only" : "Upload only";
}

// Folder path lives in the URL hash so refresh/back/forward all work.
const relFromHash = () => decodeURIComponent(location.hash.replace(/^#\/?/, ""));
function navigate(rel) {
  const next = "#/" + encodeURIComponent(rel);
  if (location.hash === next || (!rel && !location.hash)) browser.load(rel);
  else location.hash = next;
}

function showLogin(meta) {
  document.getElementById("app-view").hidden = true;
  document.getElementById("login-view").hidden = false;
  document.getElementById("login-logo").replaceChildren(logo());
  if (meta) {
    document.getElementById("login-title").textContent = meta.name;
    document.getElementById("login-desc").textContent = "This folder is password protected. Enter the password you were given to open it.";
  }
  document.getElementById("password-input").focus();
}

function enterApp(meta, permission) {
  document.getElementById("login-view").hidden = true;
  document.getElementById("app-view").hidden = false;
  document.body.classList.add("has-search");

  document.getElementById("menu-btn").replaceChildren(icon("menu"));
  document.getElementById("search-icon").replaceChildren(icon("search"));
  document.getElementById("brand-logo").replaceChildren(logo());
  document.getElementById("drawer-logo").replaceChildren(logo());
  document.getElementById("brand-name").textContent = meta.name;

  const navRoot = document.getElementById("nav-root");
  navRoot.replaceChildren(icon("folderShared"), h("span", { text: meta.name }));
  navRoot.title = meta.name;
  navRoot.onclick = () => navigate("");

  document.getElementById("access-note").textContent = permissionText(permission);
  if (permission !== "read") {
    const limit = document.getElementById("limit-note");
    limit.hidden = false;
    limit.textContent = "Upload limit: " + meta.maxUploadMB + " MB per file";
  }

  const logoutBtn = document.getElementById("logout-btn");
  logoutBtn.replaceChildren(icon("logout"), h("span", { text: "Sign out" }));
  logoutBtn.onclick = async () => {
    await api(base + "/logout", { method: "POST" }).catch(() => {});
    location.reload();
  };

  const shell = Drive.initShell();
  browser = Drive.createBrowser({
    mount: document.getElementById("main"),
    rootName: meta.name,
    permission,
    maxUploadMB: meta.maxUploadMB,
    urls: {
      files: (rel) => base + "/files" + q(rel),
      download: (rel) => base + "/download" + q(rel),
      zip: (rel) => base + "/download-zip" + q(rel),
      preview: (rel) => base + "/preview" + q(rel),
      upload: (rel) => base + "/upload" + q(rel),
    },
    navigate,
    onUnauthorized: () => location.reload(),
  });

  if (permission !== "read") {
    const newBtn = document.getElementById("new-btn");
    newBtn.hidden = false;
    newBtn.replaceChildren(icon("add"), h("span", { text: "New" }));
    newBtn.onclick = (e) => {
      e.stopPropagation();
      Drive.showMenu(newBtn, [{ label: "File upload", icon: "upload", onClick: () => { shell.closeDrawer(); browser.upload(); } }]);
    };
    const fab = document.getElementById("fab");
    fab.hidden = false;
    fab.replaceChildren(icon("upload"));
    fab.onclick = () => browser.upload();
  }

  const searchInput = document.getElementById("search-input");
  if (permission === "write") document.getElementById("search-box").hidden = true;
  searchInput.oninput = () => browser.search(searchInput.value);

  window.addEventListener("hashchange", () => {
    searchInput.value = "";
    browser.search("");
    browser.load(relFromHash());
  });
  browser.load(relFromHash());
}

document.getElementById("login-form").onsubmit = async (e) => {
  e.preventDefault();
  const password = document.getElementById("password-input").value;
  const errorEl = document.getElementById("login-error");
  errorEl.hidden = true;
  try {
    await api(base + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    // Re-fetch permission fresh rather than trusting a value captured
    // before login resolved, since the two requests can race.
    const [meta, status] = await Promise.all([api(base + "/meta"), api(base + "/status")]);
    enterApp(meta, status.permission);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.hidden = false;
  }
};

(async function init() {
  try {
    const meta = await api(base + "/meta");
    document.title = meta.name + " — Shared folder";
    const status = await api(base + "/status");
    if (status.authenticated) enterApp(meta, status.permission);
    else showLogin(meta);
  } catch (err) {
    document.body.replaceChildren(
      h("div", { class: "center-page" }, h("div", { class: "login-card" }, logo(), h("h1", { text: "Link unavailable" }), h("p", { text: err.message })))
    );
  }
})();
</script>
</body>
</html>
