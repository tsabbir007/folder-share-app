services:
  folder-share:
    build: .
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
    volumes:
      # .state.json (your share list + passwords) persists here across restarts.
      - folder-share-data:/data
      # Mount host folders at the SAME path inside the container so any
      # shares you already configured keep working without changes.
      # All of /Volumes is mounted rather than a single drive: a drive mounted
      # directly goes stale (EBADF) when it's ejected and never comes back,
      # whereas through /Volumes it's looked up fresh, so unplugging and
      # replugging just works, and the container starts even when it's absent.
      - "/Volumes:/Volumes"
    restart: unless-stopped

volumes:
  folder-share-data:
