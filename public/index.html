<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Folder Share</title>
<link rel="stylesheet" href="/assets/drive.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-bar">
  <button class="icon-btn" id="menu-btn" title="Main menu" aria-label="Main menu"></button>
  <div class="brand">
    <span id="brand-logo"></span>
    <span class="brand-name">Folder Share<span class="brand-version" id="version-tag" hidden></span></span>
  </div>
  <label class="search" id="search-box">
    <span class="icon-btn" id="search-icon" aria-hidden="true"></span>
    <input type="search" id="search-input" placeholder="Search" autocomplete="off" />
  </label>
  <div class="app-bar-end">
    <button class="tunnel-chip" id="tunnel-chip" title="Tunnel status"><span class="dot stopped" id="tunnel-chip-dot"></span><span class="chip-label" id="tunnel-chip-label">Tunnel off</span></button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head"><span id="drawer-logo"></span><span>Folder Share</span></div>
    <button class="new-btn" id="new-btn"></button>
    <button class="nav-item" id="nav-home" data-close-drawer></button>
    <div class="nav-section">Shared folders</div>
    <div id="nav-shares"></div>
    <div class="sidebar-foot">
      <div class="tunnel-card">
        <div class="tunnel-row">
          <span class="dot stopped" id="tunnel-indicator"></span>
          <span id="tunnel-label">Tunnel stopped</span>
        </div>
        <div class="tunnel-url" id="tunnel-url" hidden></div>
        <button class="btn tonal small" id="tunnel-toggle">Start tunnel</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<button class="fab" id="fab" title="New" aria-label="New"></button>
<div class="scrim" id="scrim" hidden></div>

<script src="/assets/drive.js"></script>
<script src="app.js"></script>
</body>
</html>
